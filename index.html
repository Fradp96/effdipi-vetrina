<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>effdipi</title>
<meta name="description" content="I progetti di Francesco Di Palma.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --sfondo: #0e1626;
    --sfondo-scheda: #16203350;
    --bordo: #24334d;
    --bordo-vivo: #3f6fb5;
    --testo: #e8eef8;
    --testo-tenue: #93a4bf;
    --accento: #5b93e6;
    --ombra: 0 1px 2px #0006, 0 12px 32px -12px #0009;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --sfondo: #f6f8fc;
      --sfondo-scheda: #ffffff;
      --bordo: #dde4ef;
      --bordo-vivo: #a9c4ea;
      --testo: #162033;
      --testo-tenue: #5a6a85;
      --accento: #2b6cd4;
      --ombra: 0 1px 2px #16203312, 0 10px 28px -14px #16203330;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2.5rem 1.25rem;
    background: var(--sfondo);
    color: var(--testo);
    font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 44rem; }

  header { margin-bottom: 2.5rem; }

  .marchio {
    display: inline-flex;
    align-items: center;
    gap: .625rem;
    font-size: 1.5rem;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  .marchio svg { width: 1.75rem; height: 1.75rem; color: var(--accento); }

  header p {
    margin: .75rem 0 0;
    color: var(--testo-tenue);
    font-size: 1.0625rem;
    max-width: 34rem;
  }

  .progetti {
    display: grid;
    gap: 1rem;
    grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .scheda {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: .5rem;
    padding: 1.375rem 1.5rem;
    border: 1px solid var(--bordo);
    border-radius: .875rem;
    background: var(--sfondo-scheda);
    box-shadow: var(--ombra);
    transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .scheda:hover, .scheda:focus-within {
    border-color: var(--bordo-vivo);
    transform: translateY(-2px);
  }

  .scheda h2 { margin: 0; font-size: 1.125rem; font-weight: 620; letter-spacing: -.01em; }

  .scheda h2 a {
    color: inherit;
    text-decoration: none;
    outline-offset: .35rem;
  }
  /* Rende cliccabile tutta la scheda senza annidare i link. */
  .scheda h2 a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }

  .scheda p { margin: 0; color: var(--testo-tenue); font-size: .9375rem; }

  .stato {
    align-self: flex-start;
    margin-top: .25rem;
    padding: .1875rem .5rem;
    border: 1px solid var(--bordo);
    border-radius: 999px;
    font-size: .75rem;
    letter-spacing: .02em;
    color: var(--testo-tenue);
  }

  footer {
    margin-top: 3rem;
    color: var(--testo-tenue);
    font-size: .8125rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="marchio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="5" r="2"></circle>
        <path d="M12 7v14"></path>
        <path d="M6 11h12"></path>
        <path d="M5 15a7 7 0 0 0 14 0"></path>
      </svg>
      effdipi
    </div>
    <p>Progetti in lavorazione. Scegli quello che ti interessa.</p>
  </header>

  <ul class="progetti">
    <li class="scheda">
      <h2><a href="https://yachtnav.effdipi.it">YachtNav Manager</a></h2>
      <p>Gestionale per yacht: equipaggio, documenti, conformità, manutenzioni.</p>
      <span class="stato">In prova</span>
    </li>

    <!-- Per aggiungerne un altro, copia il blocco qui sopra e cambia
         indirizzo, titolo e descrizione. La griglia si riorganizza da sola. -->
  </ul>

  <footer>effdipi.it</footer>
</main>
</body>
</html>
